<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Jakub Kučera — software engineer in Prague. Skills linked to the work that shows them." />
    <meta name="color-scheme" content="light dark" />
    <title>Jakub Kučera — CV</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply a stored theme before first paint (key shared with src/theme/useTheme.ts).
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
