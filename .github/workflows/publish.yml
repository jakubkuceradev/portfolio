name: Build and publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-publish-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Typecheck, tests and the Vite build run inside the Docker build.
      - name: Check build inputs
        run: |
          test -s package.json
          test -s package-lock.json
          test -s index.html
          test -s Caddyfile
          test -f Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/jakubkuceradev/portfolio:main
            ghcr.io/jakubkuceradev/portfolio:${{ github.sha }}
